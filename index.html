<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Sharad Verma — Portfolio, under construction." />
<title>Sharad Verma — Portfolio</title>
<link rel="icon" type="image/x-icon" href="favicon.ico" />

<script>
  // Detect a real mouse/trackpad up front, before paint, so touch devices
  // never get the custom cursor markup rendered visible.
  (function () {
    try {
      if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        document.documentElement.classList.add('has-cursor');
      }
    } catch (e) {}
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=Fraunces:ital,wght@1,500&display=swap');

  :root {
    --bg-1: #f7f6f2;
    --bg-2: #eae6da;
    --text: #16150f;
    --muted: #6d6a60;
    --accent-1: #7c6cf0;
    --accent-2: #ef8f6b;
    --accent-3: #6bd9c9;
    --line: rgba(22,21,15,.14);
    --card: rgba(255,255,255,.55);
    --blob-1: #d6c2f2;
    --blob-2: #ffc7b6;
    --blob-3: #b7ecd9;
    --blob-4: #ffe1a6;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-1: #0c0c0a;
      --bg-2: #171612;
      --text: #f3f1ea;
      --muted: #a09c8f;
      --accent-1: #9b8dfb;
      --accent-2: #ff9d76;
      --accent-3: #7fe6d4;
      --line: rgba(243,241,234,.14);
      --card: rgba(255,255,255,.05);
      --blob-1: #a98cf0;
      --blob-2: #ff9c82;
      --blob-3: #74e0c4;
      --blob-4: #ffcf66;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
    display: grid;
    place-items: center;
    transition: background .4s ease, color .4s ease;
  }

  /* custom cursor — only ever shown when JS confirms a real mouse/trackpad */
  html.has-cursor body,
  html.has-cursor a,
  html.has-cursor button {
    cursor: none;
  }

  .wash {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%, transparent 0%, var(--bg-1) 96%);
    opacity: .22;
  }

  .cursor-ring,
  .cursor-core {
    display: none;
  }

  html.has-cursor .cursor-ring,
  html.has-cursor .cursor-core {
    display: block;
  }

  .cursor-core {
    position: fixed;
    top: 0;
    left: 0;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text);
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 51;
  }

  .cursor-ring {
    position: fixed;
    top: 0;
    left: 0;
    width: 30px;
    height: 30px;
    margin-left: -15px;
    margin-top: -15px;
    border-radius: 50%;
    border: 1px solid var(--muted);
    pointer-events: none;
    z-index: 50;
    transition: width .3s ease, height .3s ease, margin .3s ease, border-color .3s ease, opacity .3s ease;
    opacity: .55;
  }

  .cursor-ring::after {
    content: "";
    position: absolute;
    top: -2px;
    left: 50%;
    width: 3px;
    height: 3px;
    margin-left: -1.5px;
    border-radius: 50%;
    background: var(--accent-1);
    animation: orbitTick 3.5s linear infinite;
    transform-origin: 1.5px 17px;
  }

  .cursor-ring.hovering {
    width: 48px;
    height: 48px;
    margin-left: -24px;
    margin-top: -24px;
    border-color: var(--accent-1);
    opacity: .85;
  }

  .cursor-ring.hovering::after {
    animation-duration: 1.2s;
    transform-origin: 1.5px 26px;
  }

  @keyframes orbitTick {
    to { transform: rotate(360deg); }
  }

  /* soft animated gradient blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(75px);
    opacity: .42;
    mix-blend-mode: normal;
    z-index: 0;
    will-change: transform;
  }

  .blob-1 {
    width: clamp(280px, 40vw, 480px);
    height: clamp(280px, 40vw, 480px);
    background: var(--blob-1);
    top: -12%; left: -10%;
    animation: drift1 26s ease-in-out infinite;
  }

  .blob-2 {
    width: clamp(260px, 36vw, 440px);
    height: clamp(260px, 36vw, 440px);
    background: var(--blob-2);
    bottom: -14%; right: -8%;
    animation: drift2 30s ease-in-out infinite;
  }

  .blob-3 {
    width: clamp(200px, 26vw, 340px);
    height: clamp(200px, 26vw, 340px);
    background: var(--blob-3);
    bottom: 4%; left: 2%;
    animation: drift3 33s ease-in-out infinite;
  }

  .blob-4 {
    width: clamp(220px, 30vw, 380px);
    height: clamp(220px, 30vw, 380px);
    background: var(--blob-4);
    top: -10%; right: -10%;
    animation: drift4 28s ease-in-out infinite;
  }

  @keyframes drift1 {
    0%   { transform: translate(0, 0) scale(1); }
    25%  { transform: translate(20vw, 14vh) scale(1.12); }
    50%  { transform: translate(34vw, 30vh) scale(1.2); }
    75%  { transform: translate(14vw, 32vh) scale(1.05); }
    100% { transform: translate(0, 0) scale(1); }
  }

  @keyframes drift2 {
    0%   { transform: translate(0, 0) scale(1); }
    25%  { transform: translate(-18vw, -16vh) scale(1.1); }
    50%  { transform: translate(-32vw, -28vh) scale(1.18); }
    75%  { transform: translate(-12vw, -30vh) scale(1.04); }
    100% { transform: translate(0, 0) scale(1); }
  }

  @keyframes drift3 {
    0%   { transform: translate(0, 0) scale(1); }
    30%  { transform: translate(16vw, -18vh) scale(1.14); }
    60%  { transform: translate(26vw, -8vh) scale(1.2); }
    100% { transform: translate(0, 0) scale(1); }
  }

  @keyframes drift4 {
    0%   { transform: translate(0, 0) scale(1); }
    30%  { transform: translate(-16vw, 20vh) scale(1.12); }
    60%  { transform: translate(-28vw, 10vh) scale(1.2); }
    100% { transform: translate(0, 0) scale(1); }
  }

  .site-header {
    position: fixed;
    top: 32px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 3;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .18em;
    text-transform: uppercase;
    animation: fadeDown .8s ease both;
  }

  .site-header .name-wrap {
    position: relative;
    display: inline-block;
    padding-bottom: 8px;
    background: linear-gradient(90deg,
      var(--text) 0%, var(--text) 30%,
      var(--accent-1) 45%, var(--accent-2) 55%, var(--accent-3) 65%,
      var(--text) 80%, var(--text) 100%);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: sheen 5s linear infinite;
  }

  .site-header .name-wrap::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 30px;
    height: 1px;
    transform: translateX(-50%);
    background: rgba(150,148,138,.5);
  }

  main.page {
    position: relative;
    z-index: 2;
    width: min(560px, 100%);
    text-align: center;
    padding: 0 24px;
    animation: fadeUp .9s .1s ease both;
  }

  .tilt {
    transform: perspective(1000px) rotateX(0deg) rotateY(0deg) translate(0, 0);
    transition: transform .25s ease-out;
    will-change: transform;
  }

  .badge {
    display: inline-block;
    margin-bottom: 24px;
    padding: 7px 16px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    backdrop-filter: blur(8px);
  }

  h1 {
    margin: 0 0 16px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(24px, 4.2vw, 34px);
    line-height: 1.35;
  }

  .subtitle {
    max-width: 40ch;
    margin: 0 auto;
    font-size: clamp(14px, 1.8vw, 16px);
    line-height: 1.8;
    color: var(--muted);
  }

  .site-footer {
    position: fixed;
    bottom: 34px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 26px;
    z-index: 3;
    animation: fadeUp 1s .2s ease both;
  }

  .site-footer a {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    backdrop-filter: blur(8px);
    color: var(--muted);
    overflow: hidden;
    transition: transform .3s ease, border-color .3s ease, color .3s ease;
  }

  .site-footer a::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--accent-2) 32%, white 68%),
      color-mix(in srgb, var(--accent-3) 32%, white 68%));
    opacity: .8;
    transform: scale(0);
    transition: transform .35s ease;
    z-index: 0;
  }

  .site-footer a svg {
    position: relative;
    z-index: 1;
    transition: transform .35s ease;
  }

  .site-footer a:hover {
    transform: translateY(-3px);
    border-color: transparent;
    color: #1c1a15;
  }

  .site-footer a:hover::before {
    transform: scale(1);
  }

  .site-footer a:hover svg {
    transform: scale(1.12) rotate(-6deg);
  }

  .site-footer svg {
    width: 17px;
    height: 17px;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes sheen {
    0% { background-position: 200% center; }
    100% { background-position: -100% center; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    .site-header .name-wrap { animation: none; }
  }

  @media (max-width: 640px) {
    .site-header { top: 24px; font-size: 12px; }
    .site-footer { bottom: 24px; gap: 18px; }
    main.page { padding: 0 20px; }
  }

  @media (max-width: 380px) {
    .site-footer { gap: 14px; }
    .site-footer a { width: 36px; height: 36px; }
  }
</style>
</head>

<body>

  <script>
    (function () {
      var hasCursor = document.documentElement.classList.contains('has-cursor');
      if (!hasCursor) return; // touch devices: skip entirely, nothing to break

      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var core = document.getElementById('cursorCore');
      var ring = document.getElementById('cursorRing');
      var page = document.getElementById('tiltWrap');

      var mouseX = window.innerWidth / 2;
      var mouseY = window.innerHeight / 2;
      var ringX = mouseX, ringY = mouseY;

      window.addEventListener('mousemove', function (e) {
        mouseX = e.clientX;
        mouseY = e.clientY;

        if (core) {
          core.style.left = mouseX + 'px';
          core.style.top = mouseY + 'px';
        }

        if (page && !reduceMotion) {
          var relX = (mouseX / window.innerWidth) - 0.5;   // -0.5 .. 0.5
          var relY = (mouseY / window.innerHeight) - 0.5;
          var maxTilt = 7;   // degrees — stronger, more noticeable tilt
          var maxShift = 12; // px
          page.style.transform =
            'perspective(1000px) ' +
            'rotateX(' + (-relY * maxTilt) + 'deg) ' +
            'rotateY(' + (relX * maxTilt) + 'deg) ' +
            'translate(' + (relX * maxShift) + 'px, ' + (relY * maxShift) + 'px)';
        }
      }, { passive: true });

      window.addEventListener('mouseleave', function () {
        if (page) {
          page.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translate(0,0)';
        }
      });

      function animateRing() {
        ringX += (mouseX - ringX) * 0.16;
        ringY += (mouseY - ringY) * 0.16;
        if (ring) {
          ring.style.left = ringX + 'px';
          ring.style.top = ringY + 'px';
        }
        requestAnimationFrame(animateRing);
      }
      animateRing();

      document.querySelectorAll('a').forEach(function (el) {
        el.addEventListener('mouseenter', function () { ring && ring.classList.add('hovering'); });
        el.addEventListener('mouseleave', function () { ring && ring.classList.remove('hovering'); });
      });
    })();
  </script>
