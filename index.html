<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sharad Verma — Coming Soon</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');

    :root {
      --paper: #d8ccb0;
      --paper-dark: #b9ab8c;
      --ink: #24231e;
      --muted: #655f50;
      --green: #4f674b;
      --red: #884e3d;
      --yellow: #aa7b2c;
      --cream: #ece3ca;
      --shadow: #151411;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: "Space Mono", monospace;
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.18), transparent 35%),
        repeating-linear-gradient(
          0deg,
          rgba(36,35,30,.035) 0,
          rgba(36,35,30,.035) 1px,
          transparent 1px,
          transparent 4px
        ),
        var(--paper);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .17;
      background-image:
        repeating-linear-gradient(
          90deg,
          transparent 0 2px,
          rgba(36,35,30,.05) 2px 3px
        );
      z-index: 10;
    }

    .page {
      width: min(980px, 92%);
      margin: auto;
      min-height: 100vh;
    }

    /* HEADER */

    header {
      padding: 25px 0 18px;
      border-bottom: 2px solid var(--ink);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .name {
      font-family: "Press Start 2P", monospace;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .mark {
      font-size: 11px;
      color: var(--muted);
    }

    /* HERO */

    .hero {
      text-align: center;
      padding: 78px 0 60px;
    }

    .repair-badge {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 32px;
      border: 3px solid var(--ink);
      background: var(--cream);
      box-shadow: 7px 7px 0 var(--shadow);
      display: grid;
      place-items: center;
      animation: float 3s ease-in-out infinite;
    }

    .repair-badge::before {
      content: "";
      width: 9px;
      height: 64px;
      background: var(--ink);
      transform: rotate(45deg);
      position: absolute;
    }

    .repair-badge::after {
      content: "";
      width: 30px;
      height: 12px;
      border: 6px solid var(--ink);
      border-bottom: 0;
      position: absolute;
      top: 12px;
      right: 13px;
      transform: rotate(45deg);
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 4px;
      margin-bottom: 22px;
      color: var(--muted);
      font-weight: 700;
    }

    h1 {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(22px, 5vw, 45px);
      line-height: 1.5;
      max-width: 760px;
      margin: auto;
    }

    .description {
      max-width: 610px;
      margin: 24px auto 0;
      font-size: 13px;
      line-height: 1.9;
      color: var(--muted);
    }

    .divider {
      width: 100%;
      margin: 35px auto 24px;
      border-top: 2px dashed var(--muted);
    }

    .waiting {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 16px;
      background: var(--ink);
      color: var(--cream);
      font-size: 11px;
      box-shadow: 5px 5px 0 var(--shadow);
    }

    .waiting-dot {
      width: 7px;
      height: 7px;
      background: var(--yellow);
      animation: blink 1.2s steps(2) infinite;
    }

    /* GAMES */

    .games {
      padding-bottom: 60px;
    }

    .games-heading {
      text-align: center;
      margin-bottom: 24px;
    }

    .games-heading h2 {
      font-family: "Press Start 2P", monospace;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .games-heading p {
      color: var(--muted);
      font-size: 10px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .game-card {
      position: relative;
      border: 2px solid var(--ink);
      background: rgba(236,227,202,.72);
      color: var(--ink);
      padding: 24px;
      cursor: pointer;
      text-align: left;
      box-shadow: 6px 6px 0 var(--shadow);
      transition: transform .16s ease, box-shadow .16s ease;
      font-family: inherit;
    }

    .game-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 9px 9px 0 var(--shadow);
    }

    .game-card:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 var(--shadow);
    }

    .game-number {
      color: var(--red);
      font-size: 10px;
      margin-bottom: 13px;
      font-weight: 700;
    }

    .game-card h3 {
      font-family: "Press Start 2P", monospace;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .game-card p {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.7;
    }

    /* FOOTER */

    footer {
      border-top: 2px solid var(--ink);
      padding: 18px 0 25px;
      text-align: center;
      color: var(--muted);
      font-size: 10px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(23,22,18,.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal.active {
      display: flex;
      animation: fade .18s ease;
    }

    .window {
      width: min(780px, 96vw);
      background: var(--cream);
      border: 3px solid var(--ink);
      box-shadow: 12px 12px 0 #080806;
      padding: 14px;
      animation: pop .2s ease;
    }

    .window-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 11px;
      margin-bottom: 12px;
    }

    .window-title {
      font-family: "Press Start 2P", monospace;
      font-size: 11px;
    }

    .close {
      width: 30px;
      height: 26px;
      border: 2px solid var(--ink);
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      line-height: 1;
    }

    .close:hover {
      background: var(--red);
      color: var(--cream);
    }

    canvas {
      display: none;
      width: 100%;
      background: #1f211d;
      border: 2px solid var(--ink);
      image-rendering: pixelated;
    }

    #snakeCanvas {
      aspect-ratio: 1.9 / 1;
    }

    #dinoCanvas,
    #pongCanvas {
      aspect-ratio: 2 / 1;
    }

    #mineCanvas {
      width: min(420px, 100%);
      aspect-ratio: 1 / 1;
      margin: auto;
    }

    .game-footer {
      margin-top: 11px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 10px;
      color: var(--muted);
    }

    .game-footer strong {
      color: var(--ink);
    }

    .restart {
      margin-top: 12px;
      border: 2px solid var(--ink);
      background: var(--paper-dark);
      padding: 10px 14px;
      font-family: inherit;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
    }

    .restart:hover {
      background: var(--ink);
      color: var(--cream);
    }

    /* ANIMATION */

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes blink {
      50% { opacity: .2; }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 650px) {
      header {
        gap: 10px;
        flex-direction: column;
        align-items: flex-start;
      }

      .hero {
        padding: 55px 0 45px;
      }

      .game-grid {
        grid-template-columns: 1fr;
      }

      .description {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>
      <div class="name">SHARAD VERMA</div>
      <div class="mark">UNDER DEVELOPMENT</div>
    </header>

    <main>

      <section class="hero">

        <div class="repair-badge"></div>

        <div class="eyebrow">WORK IN PROGRESS</div>

        <h1>Something Good<br>Is Being Built.</h1>

        <p class="description">
          Sharad Verma's portfolio is currently under development.
          It will be live shortly.
        </p>

        <div class="divider"></div>

        <div class="waiting">
          <span class="waiting-dot"></span>
          PLEASE CHECK BACK SOON
        </div>

      </section>


      <section class="games">

        <div class="games-heading">
          <h2>WHILE YOU WAIT</h2>
          <p>A few classics to pass the time.</p>
        </div>

        <div class="game-grid">

          <button class="game-card" onclick="openGame('snake')">
            <div class="game-number">01 / ARCADE</div>
            <h3>SNAKE</h3>
            <p>Eat. Grow. Don't crash.</p>
          </button>

          <button class="game-card" onclick="openGame('dino')">
            <div class="game-number">02 / RUNNER</div>
            <h3>DINO RUN</h3>
            <p>Jump. Run. Keep going.</p>
          </button>

          <button class="game-card" onclick="openGame('pong')">
            <div class="game-number">03 / SPORTS</div>
            <h3>PONG</h3>
            <p>The original two-player classic.</p>
          </button>

          <button class="game-card" onclick="openGame('mine')">
            <div class="game-number">04 / PUZZLE</div>
            <h3>MINESWEEPER</h3>
            <p>Clear the board. Avoid the mines.</p>
          </button>

        </div>
      </section>

    </main>

    <footer>
      © <span id="year"></span> Sharad Verma. All Rights Reserved.
    </footer>

  </div>


  <!-- GAME WINDOW -->

  <div class="modal" id="modal">

    <div class="window">

      <div class="window-bar">
        <div class="window-title" id="windowTitle">GAME</div>
        <button class="close" onclick="closeGame()">×</button>
      </div>

      <canvas id="snakeCanvas" width="760" height="400"></canvas>
      <canvas id="dinoCanvas" width="800" height="400"></canvas>
      <canvas id="pongCanvas" width="800" height="400"></canvas>
      <canvas id="mineCanvas" width="500" height="500"></canvas>

      <div class="game-footer">
        <span id="controls">CONTROLS</span>
        <span>SCORE: <strong id="score">0</strong></span>
      </div>

      <button class="restart" id="restartBtn">RESTART</button>

    </div>
  </div>


<script>

  document.getElementById("year").textContent = new Date().getFullYear();

  const modal = document.getElementById("modal");
  const title = document.getElementById("windowTitle");
  const controls = document.getElementById("controls");
  const scoreDisplay = document.getElementById("score");
  const restartBtn = document.getElementById("restartBtn");

  const snakeCanvas = document.getElementById("snakeCanvas");
  const dinoCanvas = document.getElementById("dinoCanvas");
  const pongCanvas = document.getElementById("pongCanvas");
  const mineCanvas = document.getElementById("mineCanvas");

  let currentGame = null;
  let animationId = null;

  function hideCanvases() {
    snakeCanvas.style.display = "none";
    dinoCanvas.style.display = "none";
    pongCanvas.style.display = "none";
    mineCanvas.style.display = "none";
  }

  function openGame(game) {
    currentGame = game;
    modal.classList.add("active");
    hideCanvases();
    cancelAnimationFrame(animationId);

    if (game === "snake") {
      title.textContent = "SNAKE";
      controls.textContent = "ARROWS / WASD";
      snakeCanvas.style.display = "block";
      initSnake();
    }

    if (game === "dino") {
      title.textContent = "DINO RUN";
      controls.textContent = "SPACE / ↑";
      dinoCanvas.style.display = "block";
      initDino();
    }

    if (game === "pong") {
      title.textContent = "PONG";
      controls.textContent = "↑ ↓ / W S";
      pongCanvas.style.display = "block";
      initPong();
    }

    if (game === "mine") {
      title.textContent = "MINESWEEPER";
      controls.textContent = "CLICK CELLS";
      mineCanvas.style.display = "block";
      initMinesweeper();
    }
  }

  function closeGame() {
    modal.classList.remove("active");
    cancelAnimationFrame(animationId);
    currentGame = null;
  }

  restartBtn.onclick = () => {
    if (currentGame === "snake") initSnake();
    if (currentGame === "dino") initDino();
    if (currentGame === "pong") initPong();
    if (currentGame === "mine") initMinesweeper();
  };

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeGame();
  });

  modal.addEventListener("click", e => {
    if (e.target === modal) closeGame();
  });


  /* ======================================================
     SNAKE
  ====================================================== */

  function initSnake() {

    cancelAnimationFrame(animationId);

    const ctx = snakeCanvas.getContext("2d");

    const cols = 38;
    const rows = 20;
    const cell = 20;

    let snake = [
      {x: 8, y: 10},
      {x: 7, y: 10},
      {x: 6, y: 10}
    ];

    let direction = {x: 1, y: 0};
    let nextDirection = {x: 1, y: 0};

    let food = makeFood();
    let score = 0;
    let dead = false;
    let last = 0;

    scoreDisplay.textContent = 0;

    function makeFood() {
      let spot;

      do {
        spot = {
          x: Math.floor(Math.random() * cols),
          y: Math.floor(Math.random() * rows)
        };
      } while (snake.some(p => p.x === spot.x && p.y === spot.y));

      return spot;
    }

    document.onkeydown = e => {

      const key = e.key.toLowerCase();

      const dirs = {
        arrowup: {x:0,y:-1},
        w: {x:0,y:-1},
        arrowdown: {x:0,y:1},
        s: {x:0,y:1},
        arrowleft: {x:-1,y:0},
        a: {x:-1,y:0},
        arrowright: {x:1,y:0},
        d: {x:1,y:0}
      };

      if (!dirs[key]) return;

      const d = dirs[key];

      if (d.x !== -direction.x || d.y !== -direction.y) {
        nextDirection = d;
      }

      e.preventDefault();
    };

    function update() {

      direction = nextDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      if (
        head.x < 0 ||
        head.x >= cols ||
        head.y < 0 ||
        head.y >= rows ||
        snake.some(p => p.x === head.x && p.y === head.y)
      ) {
        dead = true;
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreDisplay.textContent = score;
        food = makeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {

      ctx.fillStyle = "#1f211d";
      ctx.fillRect(0,0,760,400);

      ctx.strokeStyle = "#30332d";

      for (let x = 0; x <= cols; x++) {
        ctx.beginPath();
        ctx.moveTo(x*cell,0);
        ctx.lineTo(x*cell,400);
        ctx.stroke();
      }

      for (let y = 0; y <= rows; y++) {
        ctx.beginPath();
        ctx.moveTo(0,y*cell);
        ctx.lineTo(760,y*cell);
        ctx.stroke();
      }

      ctx.fillStyle = "#aa7b2c";
      ctx.fillRect(food.x*cell+4, food.y*cell+4, 12, 12);

      snake.forEach((p,i) => {
        ctx.fillStyle = i === 0 ? "#ece3ca" : "#6f8b68";
        ctx.fillRect(p.x*cell+2,p.y*cell+2,16,16);
      });

      if (dead) {
        overlay(ctx, "GAME OVER", "PRESS RESTART");
      }
    }

    function loop(time) {

      if (!dead) {

        if (time-last > 115) {
          update();
          last = time;
        }

        draw();
        animationId = requestAnimationFrame(loop);

      } else {
        draw();
      }
    }

    loop(0);
  }


  /* ======================================================
     DINO
  ====================================================== */

  function initDino() {

    cancelAnimationFrame(animationId);

    const ctx = dinoCanvas.getContext("2d");

    const ground = 315;

    let dino = {
      x: 90,
      y: ground-46,
      width: 34,
      height: 46,
      velocity: 0,
      jumping: false
    };

    let obstacles = [];
    let frame = 0;
    let score = 0;
    let speed = 5;
    let dead = false;
    let last = 0;

    scoreDisplay.textContent = 0;

    document.onkeydown = e => {

      if (
        e.code === "Space" ||
        e.key === "ArrowUp"
      ) {
        e.preventDefault();

        if (dead) {
          initDino();
          return;
        }

        if (!dino.jumping) {
          dino.velocity = -13;
          dino.jumping = true;
        }
      }
    };

    function spawn() {

      const h = 25 + Math.random()*35;

      obstacles.push({
        x: 820,
        y: ground-h,
        width: 18+Math.random()*13,
        height: h
      });
    }

    function update() {

      frame++;

      dino.velocity += .65;
      dino.y += dino.velocity;

      if (dino.y >= ground-dino.height) {
        dino.y = ground-dino.height;
        dino.velocity = 0;
        dino.jumping = false;
      }

      if (frame % 95 === 0) spawn();

      obstacles.forEach(o => o.x -= speed);

      obstacles = obstacles.filter(o => o.x+o.width > 0);

      for (const o of obstacles) {

        const hit =
          dino.x < o.x+o.width &&
          dino.x+dino.width > o.x &&
          dino.y < o.y+o.height &&
          dino.y+dino.height > o.y;

        if (hit) dead = true;
      }

      score++;
      scoreDisplay.textContent = Math.floor(score/5);
      speed += .0015;
    }

    function draw() {

      ctx.fillStyle = "#1f211d";
      ctx.fillRect(0,0,800,400);

      ctx.fillStyle = "#41443c";

      for (let i=0; i<18; i++) {
        const x = (i*83 + frame*.2) % 800;
        const y = 55+(i*41)%120;
        ctx.fillRect(x,y,2,2);
      }

      ctx.strokeStyle = "#b9ab8c";
      ctx.beginPath();
      ctx.moveTo(0,ground);
      ctx.lineTo(800,ground);
      ctx.stroke();

      ctx.fillStyle = "#41443c";

      for (let i=0; i<30; i++) {
        const x = ((i*90-frame*speed)%840+840)%840;
        ctx.fillRect(x,ground+12+(i%3)*4,14,2);
      }

      ctx.fillStyle = "#6f8b68";

      obstacles.forEach(o => {
        ctx.fillRect(o.x,o.y,o.width,o.height);
        ctx.fillRect(o.x-5,o.y+8,7,7);
      });

      drawDino();

      if (dead) overlay(ctx,"GAME OVER","PRESS SPACE OR RESTART");
    }

    function drawDino() {

      ctx.fillStyle = "#ece3ca";

      ctx.fillRect(
        dino.x,
        dino.y+15,
        34,
        31
      );

      ctx.fillRect(
        dino.x+16,
        dino.y,
        25,
        22
      );

      ctx.fillRect(
        dino.x-14,
        dino.y+26,
        17,
        6
      );

      ctx.fillRect(
        dino.x+5,
        ground-8,
        7,
        10
      );

      ctx.fillRect(
        dino.x+23,
        ground-8,
        7,
        10
      );

      ctx.fillStyle = "#1f211d";
      ctx.fillRect(
        dino.x+31,
        dino.y+6,
        4,
        4
      );
    }

    function loop(time) {

      if (!dead) {

        if (time-last > 16) {
          update();
          last = time;
        }

        draw();
        animationId = requestAnimationFrame(loop);

      } else {
        draw();
      }
    }

    animationId = requestAnimationFrame(loop);
  }


  /* ======================================================
     PONG
  ====================================================== */

  function initPong() {

    cancelAnimationFrame(animationId);

    const ctx = pongCanvas.getContext("2d");

    let player = 160;
    let computer = 160;

    let ball = {
      x:400,
      y:200,
      vx:5,
      vy:3
    };

    let playerScore = 0;
    let computerScore = 0;
    let up = false;
    let down = false;

    scoreDisplay.textContent = 0;

    document.onkeydown = e => {

      if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") {
        up = true;
        e.preventDefault();
      }

      if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") {
        down = true;
        e.preventDefault();
      }
    };

    document.onkeyup = e => {

      if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") {
        up = false;
      }

      if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") {
        down = false;
      }
    };

    function resetBall(direction) {

      ball.x = 400;
      ball.y = 200;

      ball.vx = 5 * direction;
      ball.vy = (Math.random()>.5 ? 3 : -3);
    }

    function update() {

      if (up) player -= 7;
      if (down) player += 7;

      player = Math.max(0,Math.min(320,player));

      const target = ball.y-40;

      if (computer < target) computer += 4;
      if (computer > target) computer -= 4;

      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y < 8 || ball.y > 392) {
        ball.vy *= -1;
      }

      if (
        ball.x < 36 &&
        ball.x > 22 &&
        ball.y > player-10 &&
        ball.y < player+90
      ) {
        ball.vx = Math.abs(ball.vx);
      }

      if (
        ball.x > 764 &&
        ball.x < 778 &&
        ball.y > computer-10 &&
        ball.y < computer+90
      ) {
        ball.vx = -Math.abs(ball.vx);
      }

      if (ball.x < 0) {
        computerScore++;
        scoreDisplay.textContent = `${playerScore} - ${computerScore}`;
        resetBall(1);
      }

      if (ball.x > 800) {
        playerScore++;
        scoreDisplay.textContent = `${playerScore} - ${computerScore}`;
        resetBall(-1);
      }
    }

    function draw() {

      ctx.fillStyle = "#1f211d";
      ctx.fillRect(0,0,800,400);

      ctx.strokeStyle = "#7c796d";
      ctx.setLineDash([8,10]);

      ctx.beginPath();
      ctx.moveTo(400,0);
      ctx.lineTo(400,400);
      ctx.stroke();

      ctx.setLineDash([]);

      ctx.fillStyle = "#ece3ca";

      ctx.fillRect(18,player,14,90);
      ctx.fillRect(768,computer,14,90);

      ctx.fillRect(ball.x-6,ball.y-6,12,12);

      ctx.font = '28px "Press Start 2P"';
      ctx.textAlign = "center";
      ctx.fillText(
        `${playerScore}  :  ${computerScore}`,
        400,
        55
      );
    }

    function loop() {

      update();
      draw();

      animationId = requestAnimationFrame(loop);
    }

    loop();
  }


  /* ======================================================
     MINESWEEPER
  ====================================================== */

  function initMinesweeper() {

    cancelAnimationFrame(animationId);

    const canvas = mineCanvas;
    const ctx = canvas.getContext("2d");

    const size = 10;
    const mines = 15;
    const cell = 50;

    let board = [];
    let revealed = 0;
    let dead = false;
    let won = false;

    scoreDisplay.textContent = 0;

    function createBoard() {

      board = [];

      for (let y=0; y<size; y++) {

        const row = [];

        for (let x=0; x<size; x++) {

          row.push({
            mine:false,
            reveal:false,
            flag:false,
            count:0
          });
        }

        board.push(row);
      }

      let placed = 0;

      while (placed < mines) {

        const x = Math.floor(Math.random()*size);
        const y = Math.floor(Math.random()*size);

        if (!board[y][x].mine) {
          board[y][x].mine = true;
          placed++;
        }
      }

      for (let y=0; y<size; y++) {

        for (let x=0; x<size; x++) {

          if (board[y][x].mine) continue;

          let count = 0;

          for (let dy=-1; dy<=1; dy++) {

            for (let dx=-1; dx<=1; dx++) {

              const nx=x+dx;
              const ny=y+dy;

              if (
                nx>=0 &&
                nx<size &&
                ny>=0 &&
                ny<size &&
                board[ny][nx].mine
              ) {
                count++;
              }
            }
          }

          board[y][x].count = count;
        }
      }
    }

    createBoard();

    canvas.onclick = e => {

      if (dead || won) return;

      const rect = canvas.getBoundingClientRect();

      const x = Math.floor(
        (e.clientX-rect.left) / (rect.width/size)
      );

      const y = Math.floor(
        (e.clientY-rect.top) / (rect.height/size)
      );

      if (
        x<0 ||
        x>=size ||
        y<0 ||
        y>=size
      ) return;

      reveal(x,y);

      draw();
    };

    canvas.oncontextmenu = e => {

      e.preventDefault();

      if (dead || won) return;

      const rect = canvas.getBoundingClientRect();

      const x = Math.floor(
        (e.clientX-rect.left) / (rect.width/size)
      );

      const y = Math.floor(
        (e.clientY-rect.top) / (rect.height/size)
      );

      if (!board[y][x].reveal) {
        board[y][x].flag = !board[y][x].flag;
      }

      draw();
    };

    function reveal(x,y) {

      const tile = board[y][x];

      if (tile.reveal || tile.flag) return;

      tile.reveal = true;

      if (tile.mine) {

        dead = true;

        board.forEach(row =>
          row.forEach(cell => {
            if (cell.mine) cell.reveal = true;
          })
        );

        return;
      }

      revealed++;

      scoreDisplay.textContent = revealed;

      if (tile.count === 0) {

        for (let dy=-1; dy<=1; dy++) {

          for (let dx=-1; dx<=1; dx++) {

            const nx=x+dx;
            const ny=y+dy;

            if (
              nx>=0 &&
              nx<size &&
              ny>=0 &&
              ny<size
            ) {
              reveal(nx,ny);
            }
          }
        }
      }

      if (revealed >= size*size-mines) {
        won = true;
      }
    }

    function draw() {

      ctx.fillStyle = "#1f211d";
      ctx.fillRect(0,0,500,500);

      for (let y=0; y<size; y++) {

        for (let x=0; x<size; x++) {

          const t=board[y][x];

          const px=x*cell;
          const py=y*cell;

          if (t.reveal) {

            ctx.fillStyle = t.mine
              ? "#884e3d"
              : "#b9ab8c";

            ctx.fillRect(px,py,cell,cell);

            ctx.strokeStyle="#655f50";
            ctx.strokeRect(px,py,cell,cell);

            if (t.mine) {

              ctx.fillStyle="#171713";
              ctx.beginPath();
              ctx.arc(px+25,py+25,10,0,Math.PI*2);
              ctx.fill();

            } else if (t.count > 0) {

              const numbers = [
                "",
                "#4f674b",
                "#884e3d",
                "#aa7b2c",
                "#51496f",
                "#794b35",
                "#3e6868",
                "#33332c",
                "#22221f"
              ];

              ctx.fillStyle = numbers[t.count];
              ctx.font = 'bold 19px "Space Mono"';
              ctx.textAlign = "center";
              ctx.fillText(
                t.count,
                px+25,
                py+32
              );
            }

          } else {

            ctx.fillStyle="#d8ccb0";
            ctx.fillRect(px,py,cell,cell);

            ctx.strokeStyle="#655f50";
            ctx.strokeRect(px,py,cell,cell);

            if (t.flag) {

              ctx.fillStyle="#884e3d";

              ctx.beginPath();
              ctx.moveTo(px+17,py+34);
              ctx.lineTo(px+17,py+14);
              ctx.lineTo(px+34,py+20);
              ctx.closePath();
              ctx.fill();

              ctx.fillRect(
                px+15,
                py+34,
                22,
                3
              );
            }
          }
        }
      }

      if (dead) {
        overlay(ctx,"BOOM","TRY AGAIN");
      }

      if (won) {
        overlay(ctx,"YOU WIN","NICE WORK");
      }
    }

    draw();
  }


  /* ======================================================
     COMMON OVERLAY
  ====================================================== */

  function overlay(ctx,main,sub) {

    ctx.fillStyle="rgba(20,20,17,.78)";
    ctx.fillRect(
      0,
      0,
      ctx.canvas.width,
      ctx.canvas.height
    );

    ctx.textAlign="center";

    ctx.fillStyle="#ece3ca";
    ctx.font='20px "Press Start 2P"';

    ctx.fillText(
      main,
      ctx.canvas.width/2,
      ctx.canvas.height/2-10
    );

    ctx.fillStyle="#d8ccb0";
    ctx.font='10px "Space Mono"';

    ctx.fillText(
      sub,
      ctx.canvas.width/2,
      ctx.canvas.height/2+22
    );
  }

</script>
