<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio under development." />
  <title>Portfolio — Loading</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Press+Start+2P&display=swap');

    :root {
      --bg: #eee5d0;
      --text: #28231c;
      --accent: #a54529;
      --subtle: #766b56;
      --scanline: rgba(0,0,0,.09);
      --glow: rgba(255,255,255,.32);
      --texture-dark: rgba(40,35,28,.035);
      --texture-light: rgba(40,35,28,.018);
      --shadow: rgba(40,35,28,.12);
      --buffer-bg: rgba(255,255,255,.12);
    }

    /* Automatically switch to dark mode based on user's device/browser setting */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1916;
        --text: #eee5d0;
        --accent: #d06a45;
        --subtle: #aaa08d;
        --scanline: rgba(255,255,255,.08);
        --glow: rgba(255,255,255,.05);
        --texture-dark: rgba(255,255,255,.025);
        --texture-light: rgba(255,255,255,.012);
        --shadow: rgba(0,0,0,.3);
        --buffer-bg: rgba(255,255,255,.05);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 45%, var(--glow), transparent 45%),
        repeating-linear-gradient(0deg, var(--texture-dark) 0 1px, transparent 1px 5px),
        repeating-linear-gradient(90deg, var(--texture-light) 0 1px, transparent 1px 7px),
        var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
      position: relative;
      transition: background .3s ease, color .3s ease;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        var(--scanline) 4px
      );
      opacity: .45;
    }

    .site-header {
      position: fixed;
      top: 22px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 2;
      animation: appear .8s ease both;
    }

    .page {
      width: min(760px, 100%);
      text-align: center;
      animation: appear .9s ease both;
    }

    .label {
      margin-bottom: 24px;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 34px;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(22px, 5vw, 42px);
      line-height: 1.5;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 var(--shadow);
    }

    .loading {
      padding: 10px 0;
      font-family: 'DM Mono', monospace;
      font-size: clamp(13px, 2vw, 16px);
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .buffer {
      display: inline-block;
      width: min(430px, 82vw);
      margin-top: 16px;
      padding: 4px;
      border: 2px solid var(--text);
      background: var(--buffer-bg);
      box-shadow: 5px 5px 0 var(--shadow);
    }

    .buffer-track {
      height: 24px;
      display: flex;
      gap: 3px;
      overflow: hidden;
    }

    .buffer-track span {
      flex: 1;
      min-width: 14px;
      background: var(--accent);
      opacity: .18;
      animation: fill 1.6s steps(8) infinite;
    }

    .buffer-track span:nth-child(1) { animation-delay: .0s; }
    .buffer-track span:nth-child(2) { animation-delay: .1s; }
    .buffer-track span:nth-child(3) { animation-delay: .2s; }
    .buffer-track span:nth-child(4) { animation-delay: .3s; }
    .buffer-track span:nth-child(5) { animation-delay: .4s; }
    .buffer-track span:nth-child(6) { animation-delay: .5s; }
    .buffer-track span:nth-child(7) { animation-delay: .6s; }
    .buffer-track span:nth-child(8) { animation-delay: .7s; }
    .buffer-track span:nth-child(9) { animation-delay: .8s; }
    .buffer-track span:nth-child(10) { animation-delay: .9s; }

    .subtle {
      margin-top: 16px;
      color: var(--subtle);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .thanks {
      margin: 28px auto 0;
      max-width: 600px;
      color: var(--text);
      font-size: 12px;
      line-height: 1.8;
      letter-spacing: .04em;
    }

    .site-footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 2;
      animation: appear 1s .2s ease both;
    }

    .site-footer a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color .2s ease, border-color .2s ease;
    }

    .site-footer a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    @keyframes fill {
      0%, 20% {
        opacity: .18;
        transform: scaleY(.7);
      }

      40%, 100% {
        opacity: 1;
        transform: scaleY(1);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      h1 {
        font-size: 21px;
      }

      .buffer {
        width: 86vw;
      }

      .site-header {
        font-size: 10px;
      }

      .site-footer {
        font-size: 9px;
        gap: 7px;
      }

      .thanks {
        font-size: 10px;
        line-height: 1.7;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">Sharad Verma</header>

  <main class="page">
    <div class="label">Portfolio</div>

    <h1>Work In Progress</h1>

    <div class="loading">
      <div>LOADING</div>

      <div class="buffer" aria-label="Loading">
        <div class="buffer-track">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div class="subtle">Please wait...</div>

    <div class="thanks">
      Thank you for taking the time to visit and for showing interest in my portfolio.<br />
      This website is currently under development and will be launching very soon.<br />
      See you soon!
    </div>
  </main>

  <footer class="site-footer">
    <a href="https://www.linkedin.com/in/sharadverma638" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    <span>·</span>
    <a href="https://github.com/sharadverma638" target="_blank" rel="noopener noreferrer">GitHub</a>
    <span>·</span>
    <a href="mailto:sharadverma638@gmail.com">Email</a>
  </footer>
</body>
</html>
