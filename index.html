<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Sharad Verma — Portfolio, under construction." />
<title>Sharad Verma — Portfolio</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=Fraunces:ital,wght@1,500&display=swap');

  :root {
    --bg-1: #f7f6f2;
    --bg-2: #eae6da;
    --text: #16150f;
    --muted: #6d6a60;
    --accent-1: #7c6cf0;
    --accent-2: #ef8f6b;
    --accent-3: #6bd9c9;
    --line: rgba(22,21,15,.14);
    --card: rgba(255,255,255,.55);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-1: #0c0c0a;
      --bg-2: #171612;
      --text: #f3f1ea;
      --muted: #a09c8f;
      --accent-1: #9b8dfb;
      --accent-2: #ff9d76;
      --accent-3: #7fe6d4;
      --line: rgba(243,241,234,.14);
      --card: rgba(255,255,255,.05);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
    display: grid;
    place-items: center;
    transition: background .4s ease, color .4s ease;
  }

  /* custom cursor is enabled only on devices with a real pointer */
  @media (hover: hover) and (pointer: fine) {
    body { cursor: none; }
    a, button { cursor: none; }
  }

  .cursor-dot,
  .cursor-ring {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 50;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .cursor-dot {
    width: 6px;
    height: 6px;
    background: var(--accent-1);
  }

  .cursor-ring {
    width: 32px;
    height: 32px;
    border: 1.5px solid var(--accent-1);
    transition: width .2s ease, height .2s ease, border-color .2s ease, opacity .2s ease;
    opacity: .7;
  }

  .cursor-ring.hovering {
    width: 50px;
    height: 50px;
    border-color: var(--accent-2);
    opacity: .9;
  }

  /* soft animated gradient blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .4;
    z-index: 0;
    will-change: transform;
  }

  .blob-1 {
    width: 42vw; height: 42vw;
    max-width: 460px; max-height: 460px;
    background: var(--accent-1);
    top: -10%; left: -8%;
    animation: drift1 22s ease-in-out infinite;
  }

  .blob-2 {
    width: 36vw; height: 36vw;
    max-width: 400px; max-height: 400px;
    background: var(--accent-2);
    bottom: -12%; right: -6%;
    animation: drift2 26s ease-in-out infinite;
  }

  .blob-3 {
    width: 24vw; height: 24vw;
    max-width: 300px; max-height: 300px;
    background: var(--accent-3);
    bottom: 8%; left: 6%;
    animation: drift3 30s ease-in-out infinite;
  }

  .blob-4 {
    width: 30vw; height: 30vw;
    max-width: 340px; max-height: 340px;
    background: color-mix(in srgb, var(--accent-2) 55%, var(--accent-1) 45%);
    top: -8%; right: -8%;
    animation: drift4 24s ease-in-out infinite;
  }

  @keyframes drift4 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-5vw, 7vh) scale(1.1); }
  }

  @keyframes drift1 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(6vw, 7vh) scale(1.1); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-6vw, -6vh) scale(1.08); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(5vw, -6vh) scale(1.12); }
  }

  .site-header {
    position: fixed;
    top: 32px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 3;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .18em;
    text-transform: uppercase;
    animation: fadeDown .8s ease both;
  }

  .site-header .name-wrap {
    position: relative;
    display: inline-block;
    padding-bottom: 8px;
    background: linear-gradient(90deg,
      var(--text) 0%, var(--text) 30%,
      var(--accent-1) 45%, var(--accent-2) 55%, var(--accent-3) 65%,
      var(--text) 80%, var(--text) 100%);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: sheen 5s linear infinite;
  }

  .site-header .name-wrap::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 30px;
    height: 1px;
    transform: translateX(-50%);
    background: rgba(150,148,138,.5);
  }

  main.page {
    position: relative;
    z-index: 2;
    width: min(560px, 100%);
    text-align: center;
    padding: 0 24px;
    animation: fadeUp .9s .1s ease both;
  }

  .badge {
    display: inline-block;
    margin-bottom: 24px;
    padding: 7px 16px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    backdrop-filter: blur(8px);
  }

  h1 {
    margin: 0 0 16px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(24px, 4.2vw, 34px);
    line-height: 1.35;
  }

  .subtitle {
    max-width: 40ch;
    margin: 0 auto;
    font-size: clamp(14px, 1.8vw, 16px);
    line-height: 1.8;
    color: var(--muted);
  }

  .site-footer {
    position: fixed;
    bottom: 34px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 26px;
    z-index: 3;
    animation: fadeUp 1s .2s ease both;
  }

  .site-footer a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    backdrop-filter: blur(8px);
    color: var(--muted);
    transition: transform .25s ease, border-color .25s ease, color .25s ease;
  }

  .site-footer a:hover {
    transform: translateY(-3px);
    border-color: var(--accent-1);
    color: var(--accent-1);
  }

  .site-footer svg {
    width: 17px;
    height: 17px;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes sheen {
    0% { background-position: 200% center; }
    100% { background-position: -100% center; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    .site-header .name-wrap { animation: none; }
  }

  @media (max-width: 640px) {
    .site-header { top: 24px; font-size: 12px; }
    .site-footer { bottom: 24px; gap: 18px; }
    main.page { padding: 0 20px; }
  }

  @media (max-width: 380px) {
    .site-footer { gap: 14px; }
    .site-footer a { width: 36px; height: 36px; }
  }
</style>
</head>

  <script>
    (function () {
      var dot = document.getElementById('cursorDot');
      var ring = document.getElementById('cursorRing');
      if (!dot || !ring) return;
      if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

      var ringX = 0, ringY = 0, mouseX = 0, mouseY = 0;

      window.addEventListener('mousemove', function (e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
        dot.style.left = mouseX + 'px';
        dot.style.top = mouseY + 'px';
      }, { passive: true });

      function animateRing() {
        ringX += (mouseX - ringX) * 0.18;
        ringY += (mouseY - ringY) * 0.18;
        ring.style.left = ringX + 'px';
        ring.style.top = ringY + 'px';
        requestAnimationFrame(animateRing);
      }
      animateRing();

      document.querySelectorAll('a').forEach(function (el) {
        el.addEventListener('mouseenter', function () { ring.classList.add('hovering'); });
        el.addEventListener('mouseleave', function () { ring.classList.remove('hovering'); });
      });
    })();
  </script>
